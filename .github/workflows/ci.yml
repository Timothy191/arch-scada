name: CI

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Ensure quality-gate and build scripts are executable
        run: chmod +x ./build-all.sh ./verify-quality-gates.sh ./deploy/scripts/create-backup.sh ./deploy/scripts/verify-backup.sh

      - name: Run automated quality gates (headless CI)
        run: ./verify-quality-gates.sh --skip-gui
